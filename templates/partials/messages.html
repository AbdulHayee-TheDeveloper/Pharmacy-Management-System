
{% if messages %}
<div class="container-fluid pt-3 pb-1">

    {% for message in messages %}

    <div
        class="alert alert-{{ message.tags|default:'info' }}
               alert-dismissible fade show mb-2"
        role="alert"
    >
        {{ message }}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
        ></button>
    </div>

    {% endfor %}

</div>
{% endif %}
